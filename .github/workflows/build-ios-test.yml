name: Build iOS test IPA

on:
  workflow_dispatch:
  push:
    branches:
      - build/ios-share-export-test

permissions:
  contents: read

concurrency:
  group: ios-test-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_PUBLIC_FIREBASE_ANALYTICS_ENABLED: "false"
  EXPO_PUBLIC_SENTRY_DSN: ""
  SENTRY_AUTH_TOKEN: ""
  SENTRY_DISABLE_AUTO_UPLOAD: "true"
  SENTRY_NO_UPLOAD: "1"

jobs:
  build-ios:
    name: Build unsigned iOS test IPA
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Show native build tools
        run: |
          xcodebuild -version
          pod --version

      - name: Install dependencies
        run: npm ci

      - name: Run all checks
        run: npm run check

      - name: Build and package unsigned IPA
        shell: bash
        run: bash scripts/build-unsigned-ipa.sh 2>&1 | tee "$RUNNER_TEMP/ios-test-build.log"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-unsigned-ipa
          path: zhihu-minus-minus-v*-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-build-log
          path: ${{ runner.temp }}/ios-test-build.log
          if-no-files-found: ignore
          retention-days: 7
